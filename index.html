<html lang="en"><head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>𝐎𝐖𝐍𝐄𝐑💓𝐉𝐎𝐘//𝐕𝐀𝐈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;900&family=Orbitron:wght@500;900&display=swap');

        :root {
            --bg-color: #050505;
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Exo 2', sans-serif;
        }

        .game-view { position: absolute; inset: 0; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Lighting Box UI */
        .lighting-box {
            position: fixed;
            top: 130px; left: 15px;
            width: 125px; z-index: 9999;
            touch-action: none;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            padding: 3px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .lighting-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(var(--neon-cyan), var(--neon-pink), #00ff88, var(--neon-cyan));
            animation: rotate-light 4s linear infinite;
            z-index: -1;
        }

        @keyframes rotate-light { 100% { transform: rotate(360deg); } }

        .inner-content {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 8px; font-weight: 900; color: #fff;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--neon-cyan);
            margin-bottom: 10px;
        }

        .neo-input {
            width: 85%; background: #111; border: 1px solid #333;
            border-radius: 6px; padding: 6px; color: var(--neon-cyan);
            font-size: 9px; outline: none; margin-bottom: 8px; text-align: center;
        }

        .neo-btn {
            width: 85%; background: linear-gradient(45deg, var(--neon-cyan), #0088ff);
            border: none; border-radius: 6px; color: #000;
            font-weight: 900; font-size: 9px; padding: 7px;
            cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        #display-node { display: none; }

        .result-light {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: 900; margin: 8px 0;
            letter-spacing: 2px;
        }

        .timer-glow { font-size: 10px; font-weight: bold; color: #fff; }

        .progress-container {
            width: 80%; height: 3px; background: #222;
            margin: 8px auto; border-radius: 10px; overflow: hidden;
        }

        #progress-bar {
            width: 100%; height: 100%; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 1s linear;
        }

        #mini-toggle {
            position: fixed; bottom: 30px; left: 20px;
            width: 50px; height: 50px; background: #000;
            border-radius: 50%; border: 2px solid var(--neon-cyan);
            display: none; align-items: center; justify-content: center;
            z-index: 10000; box-shadow: 0 0 20px var(--neon-cyan);
        }

        .pulse-light {
            width: 15px; height: 15px; background: var(--neon-cyan);
            border-radius: 50%; animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .action-link { font-size: 7px; color: #555; text-decoration: none; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="game-view">
        <iframe src="https://deshclub2.com/#/register?invitationCode=63261137911"><https://tkclub2.com/#/home/AllLotteryGames/WinGo?id=1></iframe>
    </div>

    <div class="lighting-box" id="dragNode">
        <div class="inner-content">
            <div class="header-title">𝐎𝐖𝐍𝐄𝐑💓𝐉𝐎𝐘//𝐕𝐀𝐈</div>

            <!-- Login Section -->
            <div id="auth-box">
                <input type="text" id="access-key" class="neo-input" placeholder="ACCESS KEY">
                <button class="neo-btn" onclick="validateSession()">START</button>
            </div>

            <!-- Dashboard Section -->
            <div id="display-node">
                <div id="clock" style="font-size:7px; color:#444;">00:00:00</div>
                <div class="result-light" id="signal-text">READY</div>
                <div class="progress-container"><div id="progress-bar"></div></div>
                <div class="timer-glow">NEXT IN: <span id="time-val">30</span>s</div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="neo-btn" style="padding:4px; font-size:7px;" onclick="minimize()">HIDE</button>
                    <button class="neo-btn" style="padding:4px; font-size:7px; background: #ff0055;" onclick="location.reload()">EXIT</button>
                </div>
                <a href="https://t.me/BDT_FREE_TAKA" target="_blank" class="action-link">TELEGRAM CHANNEL</a>
            </div>
        </div>
    </div>

    <div id="mini-toggle" onclick="maximize()"><div class="pulse-light"></div></div>

    <script>
        // এনকোড করা নতুন পাসওয়ার্ড (MjIxMTMz মানে 221133)
        const _0x4a2b = "MjIxMTMz"; 

        function validateSession() {
            const userInput = document.getElementById("access-key").value;
            if(btoa(userInput) === _0x4a2b) {
                document.getElementById("auth-box").style.display = "none";
                document.getElementById("display-node").style.display = "block";
                runLumina();
            } else {
                alert("ACCESS DENIED: WRONG KEY");
            }
        }

        // Draggable Logic
        const box = document.getElementById("dragNode");
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        box.addEventListener("touchstart", (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
            active = true;
        }, false);

        document.addEventListener("touchend", () => active = false, false);
        document.addEventListener("touchmove", (e) => {
            if (active) {
                e.preventDefault();
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                box.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }, false);

        function minimize() { box.style.display = "none"; document.getElementById("mini-toggle").style.display = "flex"; }
        function maximize() { box.style.display = "block"; document.getElementById("mini-toggle").style.display = "none"; }

        // আপনার দেওয়া ২৯টি সিগন্যালের লজিক
        function runLumina() {
            const pattern = [
                "BIG", "SMALL", "SMALL", "BIG", "SMALL", "BIG", "BIG", "BIG", 
                "SMALL", "SMALL", "SMALL", "BIG", "SMALL", "BIG", "SMALL", 
                "BIG", "SMALL", "SMALL", "BIG", "BIG", "BIG", "SMALL", 
                "SMALL", "BIG", "SMALL", "BIG", "BIG", "BIG", "SMALL"
            ];

            function tick() {
                const now = new Date();
                const totalSec = Math.floor(now.getTime() / 1000);
                
                // প্রতি ৩০ সেকেন্ডে এক একটি ইনডেক্স পরিবর্তন হবে
                const period = Math.floor(totalSec / 30);
                const idx = period % pattern.length; 
                const res = pattern[idx];
                
                const signalEl = document.getElementById("signal-text");
                signalEl.innerText = res;

                // কালার সেট করা (BIG এর জন্য সায়ান, SMALL এর জন্য পিঙ্ক)
                if(res === "BIG") {
                    signalEl.style.color = "#00ffff";
                    signalEl.style.textShadow = "0 0 15px #00ffff";
                } else {
                    signalEl.style.color = "#ff00ff";
                    signalEl.style.textShadow = "0 0 15px #ff00ff";
                }

                // টাইমার ও প্রগ্রেস বার আপডেট
                const remain = 30 - (totalSec % 30);
                document.getElementById("time-val").innerText = remain;
                document.getElementById("progress-bar").style.width = (remain / 30 * 100) + "%";
                document.getElementById("clock").innerText = now.toLocaleTimeString();
            }
            setInterval(tick, 1000);
            tick();
        }
    </script>
